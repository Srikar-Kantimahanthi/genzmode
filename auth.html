<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GENZMODE — Account</title>

  <style>

    /* =========================================
       GENZMODE AUTH
    ========================================= */

    :root {
      --truffle-brown: #2B1B17;
      --deep-truffle: #211310;

      --champagne-gold: #E8C98A;
      --luminous-gold: #F3DFAE;

      --soft-gold: rgba(232, 201, 138, 0.22);
      --gold-border: rgba(232, 201, 138, 0.45);

      --input-bg: rgba(232, 201, 138, 0.06);
    }


    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 40px 20px;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(232, 201, 138, 0.07),
          transparent 42%
        ),
        var(--deep-truffle);

      color: var(--luminous-gold);

      font-family:
        "DM Sans",
        Arial,
        sans-serif;

      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================================
       AUTH WRAPPER
    ========================================= */

    .auth-wrapper {
      width: min(920px, 100%);
      position: relative;
    }


    /* =========================================
       AUTH CARD
    ========================================= */

    .auth-card {
      position: relative;

      width: 100%;
      min-height: 530px;

      display: grid;
      grid-template-columns: 1fr 1fr;

      overflow: hidden;

      border: 1px solid var(--gold-border);

      border-radius: 26px;

      background:
        linear-gradient(
          135deg,
          rgba(43, 27, 23, 0.96),
          rgba(33, 19, 16, 0.98)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 0 50px rgba(232, 201, 138, 0.025);
    }


    /* =========================================
       FORM SIDE
    ========================================= */

    .form-side {
      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 55px 60px;

      z-index: 2;
    }

    .form-content {
      width: 100%;
      max-width: 370px;

      transition:
        opacity 0.35s ease,
        transform 0.6s cubic-bezier(.65, 0, .35, 1);
    }

    .form-title {
      margin-bottom: 34px;

      text-align: center;

      color: var(--luminous-gold);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 38px;
      font-weight: 500;

      letter-spacing: -1px;
    }


    /* =========================================
       INPUTS
    ========================================= */

    .input-group {
      position: relative;
      margin-bottom: 18px;
    }

    .input-group input {
      width: 100%;
      height: 54px;

      padding:
        0 48px
        0 18px;

      border: 1px solid
        rgba(232, 201, 138, 0.22);

      border-radius: 9px;

      outline: none;

      background:
        rgba(232, 201, 138, 0.055);

      color: var(--luminous-gold);

      font-size: 14px;

      transition:
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .input-group input::placeholder {
      color:
        rgba(232, 201, 138, 0.45);
    }

    .input-group input:focus {
      border-color:
        var(--champagne-gold);

      background:
        rgba(232, 201, 138, 0.08);

      box-shadow:
        0 0 0 3px
        rgba(232, 201, 138, 0.06);
    }

    .input-icon {
      position: absolute;

      right: 18px;
      top: 50%;

      transform:
        translateY(-50%);

      color:
        var(--champagne-gold);

      font-size: 16px;

      pointer-events: none;
    }


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    .forgot-password {
      display: block;

      margin:
        12px 0 18px;

      text-align: right;

      color:
        rgba(243, 223, 174, 0.7);

      font-size: 12px;

      text-decoration: none;

      transition:
        color 0.25s ease;
    }

    .forgot-password:hover {
      color:
        var(--champagne-gold);
    }


    /* =========================================
       PRIMARY BUTTON
    ========================================= */

    .primary-button {
      width: 100%;
      height: 52px;

      border: 1px solid
        var(--champagne-gold);

      border-radius: 9px;

      background:
        linear-gradient(
          135deg,
          var(--champagne-gold),
          var(--luminous-gold)
        );

      color:
        var(--deep-truffle);

      font-size: 14px;
      font-weight: 700;

      letter-spacing: 0.3px;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }

    .primary-button:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 10px 28px
        rgba(232, 201, 138, 0.18);
    }

    .primary-button:active {
      transform:
        translateY(0);
    }


    /* =========================================
       SOCIAL LOGIN
    ========================================= */

    .social-text {
      margin:
        17px 0 14px;

      text-align: center;

      color:
        rgba(243, 223, 174, 0.62);

      font-size: 12px;
    }

    .social-buttons {
      display: flex;

      justify-content: center;

      gap: 12px;
    }

    .social-button {
      width: 52px;
      height: 44px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: 1px solid
        rgba(232, 201, 138, 0.32);

      border-radius: 9px;

      background:
        transparent;

      color:
        var(--champagne-gold);

      font-size: 17px;
      font-weight: 600;

      transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
    }

    .social-button:hover {
      background:
        rgba(232, 201, 138, 0.08);

      border-color:
        var(--champagne-gold);

      transform:
        translateY(-2px);
    }

    /* Instagram icon */

    .instagram-icon {
      width: 18px;
      height: 18px;

      border: 2px solid
        currentColor;

      border-radius: 5px;

      position: relative;

      display: inline-block;
    }

    .instagram-icon::before {
      content: "";

      position: absolute;

      width: 6px;
      height: 6px;

      border: 2px solid
        currentColor;

      border-radius: 50%;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);
    }

    .instagram-icon::after {
      content: "";

      position: absolute;

      width: 3px;
      height: 3px;

      background:
        currentColor;

      border-radius: 50%;

      top: 3px;
      right: 3px;
    }


    /* =========================================
       WELCOME PANEL
    ========================================= */

    .welcome-side {
      position: absolute;

      top: 0;
      left: 0;

      width: 50%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 50px;

      z-index: 5;

      background:
        radial-gradient(
          circle at 35% 45%,
          rgba(232, 201, 138, 0.18),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          #4a3023,
          var(--truffle-brown)
        );

      border: 1px solid
        rgba(232, 201, 138, 0.32);

      transition:
        left 0.75s cubic-bezier(.77, 0, .175, 1),
        border-radius 0.75s cubic-bezier(.77, 0, .175, 1);

      border-radius:
        26px 50% 50% 26px;

      overflow: hidden;
    }

    .welcome-side::before {
      content: "";

      position: absolute;

      width: 420px;
      height: 420px;

      border-radius: 50%;

      border: 1px solid
        rgba(232, 201, 138, 0.14);

      transform:
        translate(-25%, -5%);
    }

    .welcome-side::after {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      border: 1px solid
        rgba(232, 201, 138, 0.08);

      transform:
        translate(25%, 25%);
    }

    .welcome-content {
      position: relative;

      z-index: 2;

      text-align: center;

      max-width: 340px;

      transition:
        opacity 0.3s ease,
        transform 0.6s cubic-bezier(.65, 0, .35, 1);
    }

    .brand {
      margin-bottom: 30px;

      color:
        var(--champagne-gold);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 13px;

      letter-spacing: 6px;

      text-transform: uppercase;
    }

    .welcome-title {
      margin-bottom: 10px;

      color:
        var(--luminous-gold);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 38px;

      font-weight: 600;

      letter-spacing: -1px;
    }

    .welcome-text {
      margin-bottom: 22px;

      color:
        rgba(243, 223, 174, 0.72);

      font-size: 13px;
    }

    .outline-button {
      min-width: 150px;
      height: 48px;

      padding:
        0 28px;

      border: 1px solid
        var(--champagne-gold);

      border-radius: 8px;

      background:
        transparent;

      color:
        var(--champagne-gold);

      font-size: 13px;

      font-weight: 600;

      transition:
        background 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .outline-button:hover {
      background:
        var(--champagne-gold);

      color:
        var(--deep-truffle);

      transform:
        translateY(-2px);
    }


    /* =========================================
       SIGNUP MODE
    ========================================= */

    .auth-card.signup-mode
    .welcome-side {
      left: 50%;

      border-radius:
        50% 26px 26px 50%;
    }

    .auth-card.signup-mode
    .form-side {
      grid-column: 1;
    }

    .auth-card.login-mode
    .form-side {
      grid-column: 2;
    }


    /* =========================================
       FORM VISIBILITY
    ========================================= */

    .login-form {
      display: block;
    }

    .signup-form {
      display: none;
    }

    .signup-mode
    .login-form {
      display: none;
    }

    .signup-mode
    .signup-form {
      display: block;
    }


    /* =========================================
       TRANSITION ANIMATION
    ========================================= */

    .auth-card.animating
    .form-content {
      animation:
        formFade 0.7s ease;
    }

    .auth-card.animating
    .welcome-content {
      animation:
        welcomeFade 0.7s ease;
    }

    @keyframes formFade {

      0% {
        opacity: 0;

        transform:
          translateX(35px);
      }

      45% {
        opacity: 0;
      }

      100% {
        opacity: 1;

        transform:
          translateX(0);
      }

    }

    @keyframes welcomeFade {

      0% {
        opacity: 0;

        transform:
          scale(0.96);
      }

      45% {
        opacity: 0;
      }

      100% {
        opacity: 1;

        transform:
          scale(1);
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 760px) {

      body {
        padding:
          25px 15px;

        align-items:
          flex-start;
      }

      .auth-card {
        display: flex;

        flex-direction: column;

        min-height: auto;

        border-radius: 22px;
      }

      .welcome-side {
        position: relative;

        order: 1;

        left: 0 !important;

        width: 100%;

        min-height: 245px;

        padding: 35px 25px;

        border-radius:
          22px 22px 45% 45% !important;
      }

      .form-side {
        order: 2;

        width: 100%;

        padding:
          42px 25px 45px;
      }

      .form-title {
        font-size: 31px;

        margin-bottom: 27px;
      }

      .welcome-title {
        font-size: 31px;
      }

      .brand {
        margin-bottom: 18px;
      }

      .welcome-side::before,
      .welcome-side::after {
        display: none;
      }

    }


    @media (max-width: 430px) {

      .form-side {
        padding:
          35px 18px 40px;
      }

      .welcome-side {
        min-height: 220px;
      }

      .welcome-title {
        font-size: 27px;
      }

      .form-title {
        font-size: 28px;
      }

      .input-group input {
        height: 52px;
      }

      .social-button {
        width: 50px;
        height: 42px;
      }

    }

  </style>

</head>


<body>


  <main class="auth-wrapper">

    <div
      class="auth-card login-mode"
      id="authCard"
    >


      <!-- =====================================
           FORM SIDE
      ====================================== -->

      <section class="form-side">

        <div class="form-content">


          <!-- ===================================
               LOGIN FORM
          ==================================== -->

          <form
            class="login-form"
            id="loginForm"
          >

            <h1 class="form-title">
              Login
            </h1>


            <div class="input-group">

              <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
                required
              >

              <span class="input-icon">
                ♙
              </span>

            </div>


            <div class="input-group">

              <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
              >

              <span class="input-icon">
                🔒
              </span>

            </div>


            <a
              href="#"
              class="forgot-password"
              id="forgotPassword"
            >
              Forgot Password?
            </a>


            <button
              type="submit"
              class="primary-button"
            >
              Login
            </button>


            <p class="social-text">
              or login with social platforms
            </p>


            <!-- GOOGLE / FACEBOOK / INSTAGRAM -->

            <div class="social-buttons">

              <button
                type="button"
                class="social-button"
                aria-label="Google"
              >
                G
              </button>


              <button
                type="button"
                class="social-button"
                aria-label="Facebook"
              >
                f
              </button>


              <button
                type="button"
                class="social-button"
                aria-label="Instagram"
              >

                <span
                  class="instagram-icon"
                ></span>

              </button>

            </div>

          </form>


          <!-- ===================================
               SIGNUP FORM
          ==================================== -->

          <form
            class="signup-form"
            id="signupForm"
          >

            <h1 class="form-title">
              Registration
            </h1>


            <div class="input-group">

              <input
                type="text"
                id="signupName"
                placeholder="Username"
                autocomplete="name"
                required
              >

              <span class="input-icon">
                ♙
              </span>

            </div>


            <div class="input-group">

              <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                autocomplete="email"
                required
              >

              <span class="input-icon">
                ✉
              </span>

            </div>


            <div class="input-group">

              <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                autocomplete="new-password"
                required
              >

              <span class="input-icon">
                🔒
              </span>

            </div>


            <button
              type="submit"
              class="primary-button"
            >
              Register
            </button>


            <p class="social-text">
              or register with social platforms
            </p>


            <!-- GOOGLE / FACEBOOK / INSTAGRAM -->

            <div class="social-buttons">

              <button
                type="button"
                class="social-button"
                aria-label="Google"
              >
                G
              </button>


              <button
                type="button"
                class="social-button"
                aria-label="Facebook"
              >
                f
              </button>


              <button
                type="button"
                class="social-button"
                aria-label="Instagram"
              >

                <span
                  class="instagram-icon"
                ></span>

              </button>

            </div>

          </form>

        </div>

      </section>


      <!-- =====================================
           WELCOME PANEL
      ====================================== -->

      <section
        class="welcome-side"
        id="welcomeSide"
      >

        <div class="welcome-content">


          <div class="brand">
            GENZMODE
          </div>


          <!-- LOGIN STATE -->

          <div
            class="welcome-login"
            id="welcomeLogin"
          >

            <h2 class="welcome-title">
              Hello, Welcome!
            </h2>

            <p class="welcome-text">
              Don't have an account?
            </p>

            <button
              type="button"
              class="outline-button"
              id="showSignup"
            >
              Register
            </button>

          </div>


          <!-- SIGNUP STATE -->

          <div
            class="welcome-signup"
            id="welcomeSignup"
            style="display:none;"
          >

            <h2 class="welcome-title">
              Welcome Back!
            </h2>

            <p class="welcome-text">
              Already have an account?
            </p>

            <button
              type="button"
              class="outline-button"
              id="showLogin"
            >
              Login
            </button>

          </div>

        </div>

      </section>

    </div>

  </main>


  <script>

    /* =========================================
       ELEMENTS
    ========================================= */

    const authCard =
      document.getElementById("authCard");

    const showSignup =
      document.getElementById("showSignup");

    const showLogin =
      document.getElementById("showLogin");

    const welcomeLogin =
      document.getElementById("welcomeLogin");

    const welcomeSignup =
      document.getElementById("welcomeSignup");

    const loginForm =
      document.getElementById("loginForm");

    const signupForm =
      document.getElementById("signupForm");


    /* =========================================
       LOGIN → SIGNUP
    ========================================= */

    showSignup.addEventListener(
      "click",
      function () {

        if (
          authCard.classList.contains(
            "signup-mode"
          )
        ) {
          return;
        }

        authCard.classList.add(
          "animating"
        );

        setTimeout(
          function () {

            authCard.classList.remove(
              "login-mode"
            );

            authCard.classList.add(
              "signup-mode"
            );

            welcomeLogin.style.display =
              "none";

            welcomeSignup.style.display =
              "block";

          },
          250
        );

        setTimeout(
          function () {

            authCard.classList.remove(
              "animating"
            );

          },
          800
        );

      }
    );


    /* =========================================
       SIGNUP → LOGIN
    ========================================= */

    showLogin.addEventListener(
      "click",
      function () {

        if (
          authCard.classList.contains(
            "login-mode"
          )
        ) {
          return;
        }

        authCard.classList.add(
          "animating"
        );

        setTimeout(
          function () {

            authCard.classList.remove(
              "signup-mode"
            );

            authCard.classList.add(
              "login-mode"
            );

            welcomeSignup.style.display =
              "none";

            welcomeLogin.style.display =
              "block";

          },
          250
        );

        setTimeout(
          function () {

            authCard.classList.remove(
              "animating"
            );

          },
          800
        );

      }
    );


    

const SHOPIFY_CLIENT_ID = "9700ce5b-7ead-43cb-b2ce-2c6b3b6e3694";
const SHOPIFY_REDIRECT_URI = "https://genzmode.vercel.app/auth.html";
const SHOPIFY_AUTH_URL = "https://shopify.com/authentication/101166711065/oauth/authorize";
const SHOPIFY_TOKEN_URL = "https://shopify.com/authentication/101166711065/oauth/token";

async function startShopifyLogin(event) {
  event.preventDefault();

  try {
    const randomBytes = crypto.getRandomValues(new Uint8Array(32));
    const verifier = Array.from(randomBytes)
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");

    const digest = await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(verifier)
    );

    const challenge = btoa(
      String.fromCharCode(...new Uint8Array(digest))
    )
      .replace(/\+/g, "-")
      .replace(/\//g, "_")
      .replace(/=+$/, "");

    const state = crypto.randomUUID();

    sessionStorage.setItem("shopify_pkce_verifier", verifier);
    sessionStorage.setItem("shopify_oauth_state", state);

    const params = new URLSearchParams({
      client_id: SHOPIFY_CLIENT_ID,
      response_type: "code",
      redirect_uri: SHOPIFY_REDIRECT_URI,
      scope: "openid email customer-account-api:full",
      state: state,
      code_challenge: challenge,
      code_challenge_method: "S256"
    });

    window.location.href = `${SHOPIFY_AUTH_URL}?${params.toString()}`;
  } catch (error) {
    console.error(error);
    alert("Unable to start login. Please try again.");
  }
}



async function completeShopifyLogin() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const error = params.get("error");

  if (error) {
    alert("Shopify login cancelled or failed. Please try again.");
    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  if (!code) return;

  const savedState = sessionStorage.getItem("shopify_oauth_state");
  const verifier = sessionStorage.getItem("shopify_pkce_verifier");

  if (!savedState || returnedState !== savedState || !verifier) {
    alert("Login session expired. Please try again.");
    window.location.replace("/auth.html");
    return;
  }

  try {
    const response = await fetch(SHOPIFY_TOKEN_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: SHOPIFY_CLIENT_ID,
        redirect_uri: SHOPIFY_REDIRECT_URI,
        code: code,
        code_verifier: verifier
      })
    });

    const data = await response.json();

    if (!response.ok || !data.access_token) {
      throw new Error(data.error_description || data.error || "Token exchange failed");
    }

    sessionStorage.setItem("genzmodeShopifyAccessToken", data.access_token);
    sessionStorage.removeItem("shopify_pkce_verifier");
    sessionStorage.removeItem("shopify_oauth_state");

    if (data.id_token) {
  sessionStorage.setItem("genzmodeShopifyIdToken", data.id_token);
}

    window.location.replace("/index.html");
  } catch (err) {
    console.error("Shopify authentication error:", err);
    alert("Login could not be completed. Please check the browser console.");
  }
}

completeShopifyLogin();


loginForm.querySelector('input[type="password"]')
  ?.removeAttribute("required");

signupForm.querySelector('input[type="password"]')
  ?.removeAttribute("required");

loginForm.addEventListener("submit", startShopifyLogin);
signupForm.addEventListener("submit", startShopifyLogin);



    /* =========================================
       FORGOT PASSWORD
    ========================================= */
