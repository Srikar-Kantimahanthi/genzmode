<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>About | genzmode</title>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================================
       GENZMODE COLORS
    ========================================= */

    :root {

      --deep-truffle: #1b100b;

      --truffle-brown: #24150f;

      --champagne-gold: #e2c387;

      --soft-champagne: #eed8ab;

      --muted-gold: rgba(238, 216, 171, 0.65);

    }


    /* =========================================
       RESET
    ========================================= */

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      background: var(--deep-truffle);

      color: var(--soft-champagne);

      font-family: "DM Sans", sans-serif;

    }


    /* =========================================
       NAVBAR
    ========================================= */

    .navbar {

      width: 100%;

      height: 76px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 4%;

      background: var(--truffle-brown);

      border-bottom: 1px solid rgba(226, 195, 135, 0.18);

    }


    .logo {

      color: var(--champagne-gold);

      text-decoration: none;

      font-family: "Playfair Display", serif;

      font-size: 25px;

      font-weight: 400;

      letter-spacing: 1px;

    }


    .nav-right {

      display: flex;

      align-items: center;

    }


    .nav-links {

      display: flex;

      align-items: center;

      gap: 30px;

    }


    .nav-links a {

      color: var(--muted-gold);

      text-decoration: none;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: 1.8px;

      transition: color 0.3s ease;

    }


    .nav-links a:hover {

      color: var(--champagne-gold);

    }


    .nav-links a:nth-child(2) {

      color: var(--champagne-gold);

    }


    /* =========================================
       ABOUT HERO
    ========================================= */

    .about-section {

      min-height: calc(100vh - 76px);

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 80px 8%;

      background:
        radial-gradient(
          circle at center,
          rgba(226, 195, 135, 0.07),
          transparent 45%
        );

    }


    .about-content {

      max-width: 850px;

    }


    .about-eyebrow {

      margin: 0 0 22px;

      color: var(--champagne-gold);

      font-size: 10px;

      font-weight: 500;

      letter-spacing: 4px;

      opacity: 0.75;

    }


    .about-content h1 {

      margin: 0;

      font-family: "Playfair Display", serif;

      font-size: clamp(55px, 8vw, 100px);

      font-weight: 400;

      line-height: 0.95;

      letter-spacing: 1px;

      color: var(--champagne-gold);

    }


    .about-line {

      width: 55px;

      height: 1px;

      margin: 32px auto;

      background: var(--champagne-gold);

      opacity: 0.6;

    }


    .about-content p {

      margin: 0 auto;

      max-width: 680px;

      color: var(--muted-gold);

      font-size: 14px;

      line-height: 2;

      letter-spacing: 0.4px;

    }


    .about-tagline {

      margin-top: 35px !important;

      font-family: "Playfair Display", serif;

      font-size: 20px !important;

      color: var(--soft-champagne) !important;

      letter-spacing: 1px !important;

    }

  </style>

</head>


<body>


  <!-- =========================================
       NAVBAR
  ========================================= -->

  <nav class="navbar">

    <!-- LOGO -->

    <a href="index.html" class="logo">
      genzmode
    </a>


    <!-- NAVIGATION -->

    <div class="nav-right">

      <div class="nav-links">

        <a href="index.html">
          HOME
        </a>

        <a href="about.html">
          ABOUT
        </a>

        <a href="policies.html">
          POLICIES
        </a>

      </div>

    </div>

  </nav>


  <!-- =========================================
       ABOUT
  ========================================= -->

  <main>

    <section class="about-section">

      <div class="about-content">

        <p class="about-eyebrow">
          THE STORY BEHIND GENZMODE
        </p>

        <h1>
          About
        </h1>

        <div class="about-line"></div>

        <p>
          genzmode is a fashion destination created for
          those who see style as an expression of who they are.
          We believe fashion should feel personal, effortless
          and confidently yours.
        </p>

        <p class="about-tagline">
          Designed for the ones who define their own style.
        </p>

      </div>

    </section>

  </main>


</body>

</html>
