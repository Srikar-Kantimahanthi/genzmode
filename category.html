<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Category | genzmode</title>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       GLOBAL
    ========================================= */

    :root {
      --truffle-brown: #2B1B17;
      --deep-truffle: #211310;
      --champagne-gold: #E8C98A;
      --luminous-gold: #F3DFAE;
      --soft-gold: rgba(232, 201, 138, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--deep-truffle);
      color: #f8ebd2;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }


    /* =========================================
       NAVBAR
    ========================================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 78px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      background: rgba(33, 19, 16, 0.88);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border-bottom: 1px solid rgba(232, 201, 138, 0.12);

      z-index: 1000;
    }


    /* =========================================
       LOGO
    ========================================= */

    .logo {
      color: var(--champagne-gold);

      text-decoration: none;

      font-family: "Playfair Display", serif;

      font-size: 28px;
      font-weight: 500;

      letter-spacing: -0.5px;

      transition: color 0.3s ease;
    }

    .logo:hover {
      color: var(--luminous-gold);
    }


    /* =========================================
       NAV LINKS
    ========================================= */

    .nav-links {
      display: flex;
      align-items: center;

      gap: 32px;
    }

    .nav-links a {
      position: relative;

      color: rgba(248, 235, 210, 0.82);

      text-decoration: none;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 0.4px;

      transition: color 0.3s ease;
    }

    .nav-links a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: var(--champagne-gold);

      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--champagne-gold);
    }

    .nav-links a:hover::after {
      width: 100%;
    }


    /* =========================================
       CATEGORY PAGE
    ========================================= */

    .category-products-section {
      min-height: 100vh;

      padding: 145px 6% 80px;

      background:
        radial-gradient(
          circle at top center,
          rgba(232, 201, 138, 0.06),
          transparent 35%
        ),
        var(--deep-truffle);
    }


    /* =========================================
       CATEGORY HEADER
    ========================================= */

    .category-page-header {
      max-width: 750px;

      margin: 0 auto 60px;

      text-align: center;
    }

    .category-page-eyebrow {
      margin-bottom: 14px;

      color: var(--champagne-gold);

      font-size: 11px;
      font-weight: 600;
      margin-top: -100px;
      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .category-page-header h1 {
      margin-bottom: 15px;

      color: #F8EBD2;

      font-family: "Playfair Display", serif;

      font-size: clamp(42px, 5vw, 68px);

      font-weight: 500;

      line-height: 1.1;
    }

    .category-page-header p:last-child {
      max-width: 600px;

      margin: 0 auto;

      color: rgba(248, 235, 210, 0.62);

      font-size: 14px;

      line-height: 1.7;
    }


    /* =========================================
       PRODUCT GRID
    ========================================= */

    .category-products-section .product-grid {
      width: 100%;

      max-width: 1500px;

      margin: 0 auto;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 42px 22px;
    }


    /* =========================================
       PRODUCT CARD
    ========================================= */

    .category-product-card {
      min-width: 0;

      position: relative;
    }


    /* =========================================
       PRODUCT IMAGE
    ========================================= */

    .category-product-image {
      position: relative;

      width: 100%;

      aspect-ratio: 3 / 4;

      overflow: hidden;

      background: #241714;
    }

    .category-product-image img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transition:
        transform 0.6s ease,
        opacity 0.5s ease;
    }

    .product-image-front {
      position: relative;

      z-index: 1;
    }

    .product-image-back {
      position: absolute;

      inset: 0;

      z-index: 2;

      opacity: 0;
    }


    /* =========================================
       IMAGE HOVER
    ========================================= */

    .category-product-card:hover
    .product-image-front {
      opacity: 0;

      transform: scale(1.03);
    }

    .category-product-card:hover
    .product-image-back {
      opacity: 1;

      transform: scale(1.03);
    }


    /* =========================================
       SALE BADGE
    ========================================= */

    .sale-badge {
      position: absolute;

      top: 14px;
      left: 14px;

      z-index: 10;

      padding: 6px 10px;

      background: var(--champagne-gold);

      color: var(--deep-truffle);

      font-size: 9px;
      font-weight: 700;

      letter-spacing: 1px;

      text-transform: uppercase;
    }


    /* =========================================
       PRODUCT ACTION BAR
    ========================================= */

    .product-action-bar {
      position: absolute;

      left: 14px;
      right: 14px;
      bottom: 14px;

      z-index: 20;

      display: flex;

      align-items: center;

      padding: 9px 12px;

      background: rgba(33, 19, 16, 0.82);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border: 1px solid rgba(232, 201, 138, 0.18);

      opacity: 0;

      transform: translateY(12px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .category-product-card:hover
    .product-action-bar {
      opacity: 1;

      transform: translateY(0);
    }


    /* =========================================
       ACTION BUTTONS
    ========================================= */

    .product-action {
      border: none;

      background: transparent;

      color: var(--champagne-gold);

      font-family: "DM Sans", sans-serif;

      cursor: pointer;
    }

    .quick-view-btn {
      flex: 1;

      padding: 5px;

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .quick-view-btn:hover {
      color: var(--luminous-gold);
    }

    .wishlist-btn {
      width: 34px;

      color: #F8EBD2;

      font-size: 21px;

      transition: color 0.3s ease;
    }

    .wishlist-btn:hover {
      color: var(--champagne-gold);
    }


    /* =========================================
       PRODUCT INFO
    ========================================= */

    .category-product-info {
      padding-top: 16px;
    }


    /* =========================================
       PRODUCT CATEGORY
    ========================================= */

    .category-product-info .product-category {
      margin-bottom: 7px;

      color: var(--champagne-gold);

      font-size: 10px;
      font-weight: 600;

      letter-spacing: 1.8px;

      text-transform: uppercase;
    }


    /* =========================================
       PRODUCT TITLE
    ========================================= */

    .category-product-info h3 {
      margin-bottom: 9px;

      color: #F8EBD2;

      font-family: "Playfair Display", serif;

      font-size: 18px;
      font-weight: 500;

      line-height: 1.3;
    }


    /* =========================================
       RATING
    ========================================= */

    .category-product-info .product-rating {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-bottom: 9px;

      color: rgba(248, 235, 210, 0.62);

      font-size: 11px;
    }

    .category-product-info .product-rating span:first-child {
      color: var(--champagne-gold);
    }


    /* =========================================
       PRICE
    ========================================= */

    .category-product-info .product-price {
      display: flex;

      align-items: center;

      gap: 9px;
    }

    .category-product-info .current-price {
      color: #F8EBD2;

      font-size: 14px;
      font-weight: 600;
    }

    .category-product-info .old-price {
      color: rgba(248, 235, 210, 0.38);

      font-size: 12px;

      text-decoration: line-through;
    }


    /* =========================================
       COLOR DOTS
    ========================================= */

    .product-colors {
      display: flex;

      align-items: center;

      gap: 7px;

      margin-top: 12px;
    }

    .product-color-dot {
      width: 14px;
      height: 14px;

      display: block;

      border-radius: 50%;

      border: 1px solid rgba(248, 235, 210, 0.3);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .product-color-dot:hover {
      transform: scale(1.2);

      border-color: var(--champagne-gold);
    }


    /* =========================================
       EMPTY CATEGORY
    ========================================= */

    .category-empty {
      grid-column: 1 / -1;

      padding: 100px 20px;

      text-align: center;

      color: rgba(248, 235, 210, 0.6);
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 1100px) {

      .navbar {
        padding: 0 5%;
      }

      .nav-links {
        gap: 22px;
      }

      .category-products-section {
        padding-left: 5%;
        padding-right: 5%;
      }

      .category-products-section .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      .navbar {
        height: auto;

        padding: 18px 20px;

        flex-direction: column;

        gap: 14px;
      }

      .logo {
        font-size: 25px;
      }

      .nav-links {
        width: 100%;

        justify-content: center;

        gap: 16px;

        flex-wrap: wrap;
      }

      .nav-links a {
        font-size: 11px;
      }

      .category-products-section {
        padding: 145px 18px 60px;
      }

      .category-page-header {
        margin-bottom: 40px;
      }

      .category-page-eyebrow {
        font-size: 9px;

        letter-spacing: 2.5px;
      }

      .category-page-header h1 {
        font-size: 40px;
      }

      .category-page-header p:last-child {
        font-size: 13px;
      }

      .category-products-section .product-grid {
        grid-template-columns: repeat(2, 1fr);

        gap: 32px 12px;
      }

      .category-product-info {
        padding-top: 12px;
      }

      .category-product-info h3 {
        font-size: 15px;
      }

      .category-product-info .product-category {
        font-size: 8px;
      }

      .category-product-info .current-price {
        font-size: 13px;
      }

      .category-product-info .old-price {
        font-size: 11px;
      }

      .product-action-bar {
        display: none;
      }

    }


    /* =========================================
   QUICK VIEW MODAL
========================================= */

.quick-view-modal {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 100vw;
  height: 100vh;

  padding: 30px;

  box-sizing: border-box;

  visibility: hidden;
  opacity: 0;

  transition:
    opacity 0.3s ease,
    visibility 0.3s ease;
}

.quick-view-modal.active {
  visibility: visible;
  opacity: 1;
}


/* =========================================
   OVERLAY
========================================= */

.quick-view-overlay {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  background: rgba(20, 12, 9, 0.82);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}


/* =========================================
   MODAL CONTENT
========================================= */

.quick-view-content {
  position: relative;
  z-index: 2;

  width: min(900px, calc(100vw - 60px));
  max-height: calc(100vh - 60px);

  display: grid;
  grid-template-columns: 45% 55%;

  overflow: hidden;

  box-sizing: border-box;

  background: #2B1B17;

  border: 1px solid rgba(232, 201, 138, 0.35);

  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.55);

  transform: translateY(20px) scale(0.97);

  transition:
    transform 0.3s ease;
}

.quick-view-modal.active .quick-view-content {
  transform: translateY(0) scale(1);
}


/* =========================================
   CLOSE
========================================= */

.quick-view-close {
  position: absolute;

  top: 18px;
  right: 18px;

  z-index: 10;

  width: 38px;
  height: 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid rgba(232, 201, 138, 0.4);
  border-radius: 50%;

  background: rgba(33, 19, 16, 0.85);

  color: #E8C98A;

  font-size: 25px;
  line-height: 1;

  cursor: pointer;
}


/* =========================================
   IMAGE
========================================= */

.quick-view-image-wrapper {
  width: 100%;
  height: 100%;

  min-height: 560px;

  overflow: hidden;

  background: #211310;
}

.quick-view-image-wrapper img {
  width: 100%;
  height: 100%;

  min-height: 560px;

  display: block;

  object-fit: cover;
}


/* =========================================
   DETAILS
========================================= */

.quick-view-details {
  min-width: 0;

  padding: 55px 48px 45px;

  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  justify-content: center;

  overflow-y: auto;
}


/* =========================================
   CATEGORY
========================================= */

.quick-view-category {
  margin: 0 0 12px;

  color: #E8C98A;

  font-size: 11px;
  font-weight: 600;

  letter-spacing: 2px;
  text-transform: uppercase;
}


/* =========================================
   TITLE
========================================= */

.quick-view-details h2 {
  margin: 0;

  color: #F8EBAB;

  font-family: "Playfair Display", serif;

  font-size: clamp(28px, 3vw, 40px);
  font-weight: 500;

  line-height: 1.15;
}


/* =========================================
   RATING
========================================= */

.quick-view-rating {
  display: flex;
  align-items: center;

  gap: 8px;

  margin-top: 16px;

  color: #F3DFAE;

  font-size: 13px;
}


/* =========================================
   PRICE
========================================= */

.quick-view-price {
  display: flex;
  align-items: center;

  gap: 12px;

  margin-top: 22px;
  padding-bottom: 24px;

  border-bottom: 1px solid rgba(232, 201, 138, 0.16);
}

.quick-current-price {
  color: #F8EBAB;

  font-size: 22px;
  font-weight: 600;
}

.quick-old-price {
  color: rgba(248, 235, 171, 0.4);

  font-size: 15px;

  text-decoration: line-through;
}


/* =========================================
   OPTION
========================================= */

.quick-view-option {
  margin-top: 24px;
}

.quick-view-option-title {
  margin-bottom: 12px;

  color: #F3DFAE;

  font-size: 12px;
  font-weight: 600;

  letter-spacing: 1.2px;
  text-transform: uppercase;
}


/* =========================================
   COLORS
========================================= */

.quick-view-colors {
  display: flex;
  align-items: center;

  gap: 12px;
}

.quick-color {
  width: 28px;
  height: 28px;

  padding: 0;

  border: 2px solid transparent;
  border-radius: 50%;

  cursor: pointer;

  box-shadow:
    0 0 0 1px rgba(248, 235, 171, 0.25);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.quick-color:hover {
  transform: scale(1.1);
}

.quick-color.active {
  box-shadow:
    0 0 0 2px #2B1B17,
    0 0 0 3px #E8C98A;
}


/* =========================================
   SIZES
========================================= */

.quick-view-sizes {
  display: flex;

  flex-wrap: wrap;

  gap: 8px;
}

.size-btn {
  min-width: 52px;
  height: 42px;

  padding: 0 14px;

  border: 1px solid rgba(232, 201, 138, 0.3);

  background: transparent;

  color: #F3DFAE;

  font-family: "DM Sans", sans-serif;

  font-size: 12px;
  font-weight: 500;

  cursor: pointer;

  transition:
    background 0.2s ease,
    color 0.2s ease,
    border-color 0.2s ease;
}

.size-btn:hover {
  border-color: #E8C98A;
}

.size-btn.active {
  background: #E8C98A;

  border-color: #E8C98A;

  color: #211310;
}


/* =========================================
   SELECTION
========================================= */

.quick-view-selection {
  min-height: 18px;

  margin: 15px 0 0;

  color: rgba(248, 235, 171, 0.55);

  font-size: 11px;
}


/* =========================================
   ADD TO BAG
========================================= */

.quick-view-add {
  width: 100%;
  height: 52px;

  margin-top: 22px;

  border: 1px solid #E8C98A;

  background: #E8C98A;

  color: #211310;

  font-family: "DM Sans", sans-serif;

  font-size: 12px;
  font-weight: 700;

  letter-spacing: 1.5px;

  cursor: pointer;
}


/* =========================================
   TABLET
========================================= */

@media (max-width: 768px) {

  .quick-view-modal {
    padding: 20px;
  }

  .quick-view-content {
    width: min(600px, calc(100vw - 40px));

    max-height: calc(100vh - 40px);

    grid-template-columns: 1fr;

    overflow-y: auto;
  }

  .quick-view-image-wrapper {
    min-height: 360px;
    height: 360px;
  }

  .quick-view-image-wrapper img {
    min-height: 360px;
  }

  .quick-view-details {
    padding: 35px 30px;
  }

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

  .quick-view-modal {
    padding: 12px;
  }

  .quick-view-content {
    width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
  }

  .quick-view-image-wrapper {
    height: 300px;
    min-height: 300px;
  }

  .quick-view-image-wrapper img {
    min-height: 300px;
  }

  .quick-view-details {
    padding: 30px 22px 25px;
  }

}

/* =========================================
   QUICK VIEW JS CLASS FIX
========================================= */

.quick-view-image-wrapper {
  min-height: 560px;
  background: #211310;
  overflow: hidden;
}

.quick-view-image-wrapper img {
  width: 100%;
  height: 100%;
  min-height: 560px;
  display: block;
  object-fit: cover;
}

.quick-view-option-title {
  margin: 0 0 12px;

  color: #F3DFAE;

  font-size: 12px;
  font-weight: 600;

  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.quick-view-sizes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

@media (max-width: 768px) {

  .quick-view-image-wrapper {
    min-height: 360px;
    height: 360px;
  }

  .quick-view-image-wrapper img {
    min-height: 360px;
  }

}

@media (max-width: 480px) {

  .quick-view-image-wrapper {
    height: 310px;
    min-height: 310px;
  }

  .quick-view-image-wrapper img {
    min-height: 310px;
  }

}


.wishlist-toast {
  position: fixed;
  right: 30px;
  bottom: 30px;
  padding: 14px 20px;
  background: var(--deep-truffle);
  border: 1px solid var(--champagne-gold);
  color: var(--champagne-gold);
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 1.2px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(15px);
  transition:
    opacity 0.3s ease,
    transform 0.3s ease,
    visibility 0.3s ease;
  z-index: 5000;
}

.wishlist-toast.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}


/* =========================================
   GENZMODE NAVBAR
========================================= */

.navbar {
  width: 100%;
  height: 88px;

  padding: 0 6%;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: var(--truffle-brown);

  border-bottom: 1px solid var(--soft-gold);

  position: relative;
  z-index: 1000;
}


/* =========================================
   LOGO
========================================= */

.logo {
  color: var(--champagne-gold);

  font-family: "Playfair Display", serif;
  font-size: 28px;
  font-weight: 600;

  letter-spacing: -0.5px;

  text-decoration: none;
  white-space: nowrap;
}


/* =========================================
   NAVIGATION LINKS
========================================= */

.nav-links {
  display: flex;
  align-items: center;

  gap: 40px;
}

.nav-links a {
  position: relative;

  color: var(--champagne-gold);

  text-decoration: none;

  font-size: 13px;
  font-weight: 500;

  letter-spacing: 1.2px;
  text-transform: uppercase;

  transition:
    color 0.3s ease,
    opacity 0.3s ease;
}


/* UNDERLINE ANIMATION */

.nav-links a::after {
  content: "";

  position: absolute;

  left: 0;
  bottom: -8px;

  width: 0;
  height: 1px;

  background: var(--luminous-gold);

  transition: width 0.3s ease;
}

.nav-links a:hover {
  color: var(--luminous-gold);
}

.nav-links a:hover::after {
  width: 100%;
}


/* =========================================
   NAV RIGHT
========================================= */

.nav-right {
  display: flex;
  align-items: center;
  gap: 30px;
}


/* =========================================
   SEARCH BUTTON
========================================= */

.search-button {
  display: flex;
  align-items: center;
  gap: 7px;

  padding: 8px 0;

  border: none;
  background: transparent;

  color: var(--champagne-gold);

  font-family: "DM Sans", sans-serif;
  font-size: 10px;
  font-weight: 500;

  letter-spacing: 1.5px;
  text-transform: lowercase;

  cursor: pointer;

  transition:
    color 0.25s ease,
    transform 0.25s ease;
}

.search-button:hover {

}

========================================= */

/* =========================================

========================================= */

.bag-header {

}

/* =========================================

.bag-content {

}

}

.bag-checkout {

  font-size: 11px;
  font-weight: 700;

  letter-spacing: 1.5px;

  cursor: pointer;

  transition:
    background 0.25s ease,

}

.bag-checkout:hover {

  color: var(--champagne-gold);
}


/* =========================================
   WISHLIST OVERLAY
========================================= */

.wishlist-overlay {
  position: fixed;
  inset: 0;

  background: rgba(0, 0, 0, 0.45);

  visibility: hidden;

  transition:
    opacity 0.3s ease,

}

.wishlist-overlay.active {

  visibility: visible;
}


/* =========================================
   WISHLIST DRAWER
========================================= */

.wishlist-drawer {

  right: 0;

  display: flex;
  flex-direction: column;

/* =========================================
   WISHLIST HEADER
========================================= */

}

========================================= */

}

  font-size: 38px;
  margin-bottom: 15px;
  opacity: 0.7;
}

  color: #f3d49a;
  font-size: 18px;
}

.bag-empty p {
  margin: 0;
  color: #cdb9aa;
  font-size: 13px;
}


/* =========================================
   BAG FOOTER
========================================= */

.bag-footer {

  border-top: 1px solid rgba(236, 204, 145, 0.18);
  background: #2d1b17;
}

.bag-subtotal {

  align-items: center;
  justify-content: space-between;

  font-size: 14px;
}

.bag-subtotal strong {

}


/* =========================================

========================================= */

.bag-checkout {

}

  background: #f5d99e;
}

.bag-checkout:disabled {
  opacity: 0.45;

}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

  .bag-item {
    gap: 12px;
    padding: 15px 14px;
